/* Lớp phủ tối để chữ nổi hơn */
.overlay {
    background: rgba(0,0,0,0.55);
    position: fixed;
    inset: 0;
}

.card {
    position: relative;
    background: #fff;
    border-radius: 22px;
    padding: 24px;
    width: 380px;
    margin: auto;
    top: 50%;
    transform: translateY(-50%);
    text-align: center;
    box-shadow: 0 20px 30px rgba(0,0,0,0.35);
    z-index: 2;
}

.banner {
    width: 100%;
    border-radius: 16px;
    margin-bottom: 12px;
}

#text {
    font-size: 17px;
    min-height: 90px;
    margin-bottom: 18px;
}

button {
    padding: 12px 26px;
    font-size: 16px;
    border: none;
    border-radius: 20px;
    cursor: pointer;
    margin: 6px;
}

#yes {
    background: #e74c3c;
    color: white;
}

#no {
    background: #bdc3c7;
    position: absolute;
}

.cute {
    font-size: 26px;
    margin: 6px 0;
}

/* ===== Trang kết quả ===== */
#result {
    display: none;
}

.result-text {
    font-size: 20px;
    margin: 18px 0;
}

.icons {
    font-size: 32px;
}
</style>

<script>
const lines = [
    "Ê Linh ơi 👋",
    "Giáng Sinh sắp tới rồi đó 🎄",
    "Không biết Linh có rảnh không nữa 🤔",
    "Nhưng Dũng hỏi thử nè..."
];

const question = "👉 Giáng Sinh này đi chơi cùng Dũng nhé? 😄";

let i = 0, j = 0;

function typeText(text, callback) {
    j = 0;
    document.getElementById("text").innerHTML = "";
    const typing = setInterval(() => {
        if (j < text.length) {
            document.getElementById("text").innerHTML += text.charAt(j);
            j++;
        } else {
            clearInterval(typing);
            if (callback) setTimeout(callback, 700);
        }
    }, 45);
}

function nextLine() {
    if (i < lines.length) {
        typeText(lines[i], () => {
            i++;
            nextLine();
        });
    } else {
        typeText(question, () => {
            document.getElementById("buttons").style.display = "block";
        });
    }
}

function yesClick() {
    document.getElementById("page1").style.display = "none";
    document.getElementById("result").style.display = "block";
}

function moveNo() {
    const no = document.getElementById("no");
    no.style.left = Math.random() * 240 + "px";
    no.style.top = Math.random() * 140 + "px";
}

window.onload = nextLine;
</script>
